[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cobblerpy"
# The version lives in ONE place, cobblerpy/__init__.py, and is read from there.
dynamic = ["version"]
description = "Make sense of a Python codebase somebody else left behind"
readme = "README.md"
license = { file = "LICENSE" }
# 3.11, not 3.9: nothing here was ever run below 3.11, and the project's
# own checkers cannot run there -- verify_e2e.py, packaging/verify_dist.py
# and one unit test import tomllib, which arrived in 3.11. Raised
# 2026-09-22 rather than ship a compatibility claim nobody has tested.
requires-python = ">=3.11"
authors = [{ name = "Brandon S. Butler" }]
keywords = ["static-analysis", "ast", "code-archaeology", "legacy-code",
            "dependency-graph", "no-dependencies"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    # The series CI actually runs (.github/workflows/ci.yml): 3.11, 3.13,
    # 3.14. 3.12 sits between two tested series and is listed with them.
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

# RUNTIME DEPENDENCIES: none, deliberately, and this list stays empty. The
# input is somebody else's source, often under an NDA; a tool that reads it
# should not also drag a supply chain onto the machine.
dependencies = []

[project.optional-dependencies]
# The LIBRARY has no dependencies. The desktop window has one, and it is
# here so that `pip install cobblerpy` stays dependency-free and
# `pip install cobblerpy[gui]` adds the toolkit for the window.
# PySide6-Essentials caps the interpreter as well as naming a floor: every
# release this range allows declares python_requires <3.14 or <3.15, and
# the newest (6.11.x) declares >=3.10,<3.15 (read from PyPI 2026-09-22).
# So the extra installs cleanly across 3.11-3.14 and will need a newer
# Qt before 3.15. It does not push this package's floor above 3.11.
gui = ["PySide6-Essentials>=6.5"]

[project.scripts]
cobblerpy = "cobblerpy.__main__:main"
cobble = "cobblerpy.launch:main"
cobblerpy-gui = "cobblerpy.gui.qt_app:main"

[project.urls]
Homepage = "https://github.com/brandonsbutler-ai/code-cobbler"

[tool.setuptools]
packages = ["cobblerpy", "cobblerpy.gui"]

[tool.setuptools.dynamic]
version = { attr = "cobblerpy.__version__" }
